<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F4EE"/>

  <text x="60" y="78" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F2A33">改了没反应：机器上躺着两份 index.js</text>
  <text x="60" y="118" font-family="Noto Sans CJK SC" font-size="21" fill="#6B7A85">我改的那份没在跑，跑的那份我没在改</text>
  <line x1="60" y1="142" x2="1540" y2="142" stroke="#D8D2C6" stroke-width="2"/>

  <rect x="60" y="180" width="716" height="152" rx="14" fill="#FFFFFF" stroke="#2B6777" stroke-width="3"/>
  <text x="90" y="222" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#1F2A33">我在改的：插件源码</text>
  <text x="90" y="256" font-family="Noto Sans CJK SC" font-size="16" fill="#4A5A66">~/.dsh/plugins/dsh-subagent-workbuddy/lib/index.js</text>
  <text x="90" y="300" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#2B6777">mtime 12:01</text>
  <text x="746" y="300" text-anchor="end" font-family="Noto Sans CJK SC" font-size="16" fill="#98A4AD">改完，重启</text>

  <rect x="824" y="180" width="716" height="152" rx="14" fill="#EFEBE2" stroke="#C9C2B4" stroke-width="3"/>
  <text x="854" y="222" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#7A838B">dsh 实际在跑的：pnpm 拷贝</text>
  <text x="854" y="256" font-family="Noto Sans CJK SC" font-size="16" fill="#7A838B">~/.dsh/profiles/web/node_modules/dsh-subagent-workbuddy/</text>
  <text x="854" y="300" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#B85C1E">mtime 11:22</text>
  <text x="1510" y="300" text-anchor="end" font-family="Noto Sans CJK SC" font-size="16" fill="#98A4AD">一直没动过</text>

  <line x1="180" y1="540" x2="1420" y2="540" stroke="#D8D2C6" stroke-width="3"/>

  <text x="360" y="440" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#B85C1E">11:22</text>
  <text x="360" y="478" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">拷贝停在 11:22</text>
  <text x="360" y="506" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#98A4AD">dsh 一直读的就是这一份</text>
  <circle cx="360" cy="540" r="13" fill="#B85C1E"/>

  <text x="820" y="440" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#2B6777">12:01</text>
  <text x="820" y="478" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">源文件改好了</text>
  <text x="820" y="506" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#98A4AD">但没有人读它</text>
  <circle cx="820" cy="540" r="13" fill="#2B6777"/>

  <text x="1280" y="440" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" font-weight="700" fill="#B85C1E">12:02</text>
  <text x="1280" y="478" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">重启</text>
  <text x="1280" y="506" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#98A4AD">一模一样地崩</text>
  <circle cx="1280" cy="540" r="13" fill="#B85C1E"/>

  <path d="M 360 585 L 360 612 L 820 612 L 820 585" fill="none" stroke="#E07B39" stroke-width="3"/>
  <text x="590" y="662" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="25" font-weight="700" fill="#E07B39">差 39 分钟</text>
  <text x="590" y="692" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" fill="#B85C1E">不是思考时间，是在跟一个幽灵较劲</text>

  <rect x="60" y="726" width="1480" height="106" rx="12" fill="#FFF3E6" stroke="#E07B39" stroke-width="3"/>
  <text x="90" y="766" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#B85C1E">根因：dsh 的 profile 是 pnpm 工程，用 hoisted nodeLinker</text>
  <text x="90" y="802" font-family="Noto Sans CJK SC" font-size="19" fill="#4A5A66">依赖写成 file: 时 pnpm 会把包拷贝进 node_modules，于是运行中的 dsh 一直在跑安装那一刻的快照</text>

  <text x="60" y="872" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">解法：依赖 spec 改 link: 建软链接，源码即生效；再加一个幂等脚本每次启动前自愈</text>
</svg>
