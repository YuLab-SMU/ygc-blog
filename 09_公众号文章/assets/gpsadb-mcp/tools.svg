<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F4EE"/>

  <text x="80" y="92" font-family="Noto Sans CJK SC" font-size="34" font-weight="bold" fill="#1F2A33">11 个工具，11 个函数</text>
  <text x="80" y="132" font-family="Noto Sans CJK SC" font-size="20" fill="#6B7A85">左边是"查这个实验"，右边是"反过来查"和"拿自己的数据比"</text>
  <line x1="80" y1="158" x2="1520" y2="158" stroke="#D8D2C6" stroke-width="2"/>

  <!-- 左栏 -->
  <text x="80" y="206" font-family="Noto Sans CJK SC" font-size="19" font-weight="bold" fill="#2B6777">查这个实验</text>
  <line x1="80" y1="220" x2="760" y2="220" stroke="#2B6777" stroke-width="1.5"/>

  <g font-size="18">
    <text x="80" y="268" font-family="DejaVu Sans Mono" fill="#6B7A85">get_database_info</text>
    <text x="420" y="268" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_info()</text>
    <text x="80" y="322" font-family="DejaVu Sans Mono" fill="#6B7A85">search_datasets</text>
    <text x="420" y="322" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_search_datasets()</text>
    <text x="80" y="376" font-family="DejaVu Sans Mono" fill="#6B7A85">get_dataset</text>
    <text x="420" y="376" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_dataset()</text>
    <text x="80" y="430" font-family="DejaVu Sans Mono" fill="#6B7A85">get_differential_expression</text>
    <text x="420" y="430" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_de()</text>
    <text x="80" y="484" font-family="DejaVu Sans Mono" fill="#6B7A85">get_gsea_results</text>
    <text x="420" y="484" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_gsea()</text>
    <text x="80" y="538" font-family="DejaVu Sans Mono" fill="#6B7A85">search_gene_sets</text>
    <text x="420" y="538" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_search_gene_sets()</text>
  </g>

  <!-- 右栏 -->
  <text x="860" y="206" font-family="Noto Sans CJK SC" font-size="19" font-weight="bold" fill="#E07B39">反过来查，拿自己的数据比</text>
  <line x1="860" y1="220" x2="1520" y2="220" stroke="#E07B39" stroke-width="1.5"/>

  <g font-size="18">
    <text x="860" y="268" font-family="DejaVu Sans Mono" fill="#6B7A85">query_gene</text>
    <text x="1150" y="268" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_query_gene()</text>
    <text x="860" y="322" font-family="DejaVu Sans Mono" fill="#6B7A85">query_gene_set</text>
    <text x="1150" y="322" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_query_gene_set()</text>
    <text x="860" y="376" font-family="DejaVu Sans Mono" fill="#6B7A85">test_gene_set_in_dataset</text>
    <text x="1150" y="376" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_test_gene_set()</text>
    <text x="860" y="430" font-family="DejaVu Sans Mono" fill="#6B7A85">run_biotrigger</text>
    <text x="1150" y="430" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_biotrigger()</text>
    <text x="860" y="484" font-family="DejaVu Sans Mono" fill="#6B7A85">run_fastgpsa</text>
    <text x="1150" y="484" font-family="DejaVu Sans Mono" fill="#1F2A33">gpsadb_fastgpsa()</text>
  </g>

  <line x1="80" y1="600" x2="1520" y2="600" stroke="#D8D2C6" stroke-width="1.5"/>

  <text x="80" y="646" font-family="Noto Sans CJK SC" font-size="19" fill="#1F2A33">每个函数都返回同一个结果对象：gpsadb_data() 是 tibble，gpsadb_meta() 是这一页的标量</text>
  <text x="80" y="686" font-family="Noto Sans CJK SC" font-size="19" fill="#1F2A33">结果能像表一样索引：nrow(x)、x[1:3, ]、names(x)；服务端加了新工具，先用 gpsadb_tool_catalog() 看名字，再用 gpsadb_raw() 直接调</text>
  <text x="80" y="726" font-family="Noto Sans CJK SC" font-size="19" fill="#1F2A33">gpsadb_tools() 把这 11 个还给 aisdk，交给模型自己决定调哪个</text>

  <text x="80" y="830" font-family="Noto Sans CJK SC" font-size="15" fill="#6B7A85">工具名与参数以服务端为准，包里没有第二份定义</text>
</svg>
