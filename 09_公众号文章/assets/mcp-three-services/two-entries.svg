<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F4EE"/>

  <text x="80" y="88" font-family="Noto Sans CJK SC" font-size="34" font-weight="bold" fill="#1F2A33">同一份能力，两种入口</text>
  <text x="80" y="126" font-family="Noto Sans CJK SC" font-size="20" fill="#6B7A85">MCP 端点服务的是 agent，R 包服务的是你；代码是你和模型之间的合同</text>
  <line x1="80" y1="152" x2="1520" y2="152" stroke="#D8D2C6" stroke-width="2"/>

  <!-- MCP endpoints row -->
  <g>
    <rect x="80" y="196" width="300" height="86" rx="14" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
    <text x="104" y="232" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" fill="#1F2A33">GPSAdb 端点</text>
    <text x="104" y="262" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">扰动转录组 · 12 个工具</text>

    <rect x="460" y="196" width="300" height="86" rx="14" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
    <text x="484" y="232" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" fill="#1F2A33">GTBAdb 端点</text>
    <text x="484" y="262" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">TCGA/GTEx/CCLE · 11 个</text>

    <rect x="840" y="196" width="300" height="86" rx="14" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
    <text x="864" y="232" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" fill="#1F2A33">STRING 端点</text>
    <text x="864" y="262" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">蛋白互作 · 17 个工具</text>

    <rect x="1220" y="196" width="300" height="86" rx="14" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1244" y="232" font-family="Noto Sans CJK SC" font-size="22" font-weight="bold" fill="#6B7A85">PDBe / NCBI …</text>
    <text x="1244" y="262" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">同一套机制，随时加</text>
  </g>

  <!-- transport layer -->
  <rect x="80" y="330" width="1440" height="72" rx="14" fill="#FFF3E6" stroke="#E07B39" stroke-width="2"/>
  <text x="108" y="374" font-family="Noto Sans CJK SC" font-size="21" fill="#1F2A33">aisdk.mcp：一次 POST、结构化输出、错误分型、工具契约</text>
  <text x="1180" y="374" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">mcp_action　·　mcp_intent</text>

  <!-- two entries -->
  <g>
    <rect x="80" y="470" width="700" height="150" rx="16" fill="#FFFFFF" stroke="#2B6777" stroke-width="2.5"/>
    <text x="108" y="512" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" fill="#2B6777">确定性函数</text>
    <text x="108" y="550" font-family="Noto Sans CJK SC" font-size="18" fill="#1F2A33">gpsadb_de()　gpsadb_gsea()　gpsadb_query_gene()</text>
    <text x="108" y="584" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">参数写死，结果可复现，不用跟模型商量</text>

    <rect x="820" y="470" width="700" height="150" rx="16" fill="#FFFFFF" stroke="#E07B39" stroke-width="2.5"/>
    <text x="848" y="512" font-family="Noto Sans CJK SC" font-size="24" font-weight="bold" fill="#E07B39">意图 → 代码</text>
    <text x="848" y="550" font-family="Noto Sans CJK SC" font-size="18" fill="#1F2A33">gpsadb_intent()　mcp_intent()</text>
    <text x="848" y="584" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">返回代码，不执行；改完再跑，能进仓库</text>
  </g>

  <!-- chain -->
  <text x="80" y="700" font-family="Noto Sans CJK SC" font-size="20" font-weight="bold" fill="#1F2A33">串起来就是一条管道：</text>
  <g>
    <rect x="330" y="668" width="250" height="66" rx="12" fill="#FFFFFF" stroke="#2B6777" stroke-width="2"/>
    <text x="352" y="708" font-family="Noto Sans CJK SC" font-size="19" fill="#1F2A33">扰动　−4.28</text>

    <rect x="660" y="668" width="250" height="66" rx="12" fill="#FFFFFF" stroke="#2B6777" stroke-width="2"/>
    <text x="682" y="708" font-family="Noto Sans CJK SC" font-size="19" fill="#1F2A33">关联　0.77 / 0.56 / 0.32</text>

    <rect x="990" y="668" width="290" height="66" rx="12" fill="#FFFFFF" stroke="#2B6777" stroke-width="2"/>
    <text x="1012" y="708" font-family="Noto Sans CJK SC" font-size="19" fill="#1F2A33">物理　0.35 ｜ 调控 0.89</text>
  </g>
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#2B6777"/>
    </marker>
  </defs>
  <line x1="580" y1="701" x2="652" y2="701" stroke="#2B6777" stroke-width="3" marker-end="url(#a)"/>
  <line x1="910" y1="701" x2="982" y2="701" stroke="#2B6777" stroke-width="3" marker-end="url(#a)"/>

  <text x="80" y="812" font-family="Noto Sans CJK SC" font-size="17" fill="#6B7A85">三层证据指向同一个结构：扰动打掉调控，人群里同步，蛋白层面是调控不是复合物。</text>
</svg>
