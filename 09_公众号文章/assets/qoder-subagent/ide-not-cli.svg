<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F4EE"/>

  <text x="60" y="78" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F2A33">有 IDE，不等于有 CLI</text>
  <text x="60" y="118" font-family="Noto Sans CJK SC" font-size="21" fill="#6B7A85">能跟你聊天的那个东西，和能被使唤的那个东西，是两码事</text>
  <line x1="60" y1="142" x2="1540" y2="142" stroke="#D8D2C6" stroke-width="2"/>

  <rect x="60" y="190" width="420" height="230" rx="14" fill="#FFFFFF" stroke="#2B6777" stroke-width="3"/>
  <text x="270" y="240" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#1F2A33">你看到的东西</text>
  <line x1="90" y1="262" x2="450" y2="262" stroke="#E4E0D7" stroke-width="2"/>
  <text x="270" y="306" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" fill="#4A5A66">Qoder CN IDE 在跑</text>
  <text x="270" y="340" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" fill="#4A5A66">/usr/bin/qoder-cn → Electron</text>
  <text x="270" y="380" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">tasks / projects / logs 一应俱全</text>
  <text x="270" y="406" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">$HOME/.qoder-cn 底下什么都有</text>

  <text x="510" y="310" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="28" fill="#E07B39">≠</text>

  <rect x="560" y="190" width="420" height="230" rx="14" fill="#EFEBE2" stroke="#C9C2B4" stroke-width="3"/>
  <text x="770" y="240" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="23" font-weight="700" fill="#7A838B">能被使唤的东西</text>
  <line x1="590" y1="262" x2="950" y2="262" stroke="#DDD7CC" stroke-width="2"/>
  <text x="770" y="306" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" fill="#7A838B">CLI 入口 qoderclicn</text>
  <text x="770" y="340" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19" fill="#7A838B">不在 PATH 上</text>
  <text x="770" y="380" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">$HOME/.qoder-cn/bin 这个目录</text>
  <text x="770" y="406" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">压根不存在</text>

  <rect x="1030" y="190" width="510" height="230" rx="14" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
  <text x="1060" y="240" font-family="Noto Sans CJK SC" font-size="21" font-weight="700" fill="#1F2A33">去 app.asar 里搜协议关键字</text>
  <line x1="1060" y1="262" x2="1510" y2="262" stroke="#E4E0D7" stroke-width="2"/>
  <text x="1060" y="302" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">session/update</text>
  <text x="1460" y="302" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">0 命中</text>
  <text x="1060" y="336" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">fs/write_text_file</text>
  <text x="1460" y="336" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">0 命中</text>
  <text x="1060" y="370" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">AgentSideConnection</text>
  <text x="1460" y="370" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">0 命中</text>
  <text x="1060" y="404" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">agent-client-protocol</text>
  <text x="1460" y="404" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">0 命中</text>

  <rect x="60" y="470" width="1480" height="110" rx="12" fill="#FFF3E6" stroke="#E07B39" stroke-width="3"/>
  <text x="800" y="512" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#B85C1E">所以那天第一步，是先确认它到底存不存在</text>
  <text x="800" y="552" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="18" fill="#B85C1E">IDE 里那个 agent 是嵌在 Electron 里的，不是我要连的那个 server</text>

  <rect x="60" y="618" width="1480" height="120" rx="12" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
  <text x="90" y="658" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#1F2A33">痕迹会骗人</text>
  <text x="90" y="694" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">~/.qoder-cli/ai-stats/ 里躺着 commit 级的 AI 统计（brand / product / scenario 三个字段都在）</text>
  <text x="90" y="724" font-family="Noto Sans CJK SC" font-size="18" fill="#4A5A66">shell-snapshot 里还留着 export PATH=$HOME/.qoder-cn/bin:... 说明它以前装过</text>

  <text x="60" y="812" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">「装没装」这件事不能看痕迹，得看二进制。qoder-cn --help 弹出来的是浏览器窗口，因为这个名字已经被 IDE 占了。</text>
  <text x="60" y="842" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">实测：/opt/Qoder CN/qoder-cn 219MB Electron · app.asar 133MB · 2026-09-22</text>
</svg>
