<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F4EE"/>

  <text x="60" y="78" font-family="Noto Sans CJK SC" font-size="34" font-weight="700" fill="#1F2A33">点名的模型，被静默换成了别的</text>
  <text x="60" y="118" font-family="Noto Sans CJK SC" font-size="21" fill="#6B7A85">CLINE_MODEL、--model、session/set_model 三条路都一样：账户用不了的 id 一律忽略</text>
  <line x1="60" y1="142" x2="1540" y2="142" stroke="#D8D2C6" stroke-width="2"/>

  <text x="60" y="192" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#2B6777">生效的（免费档）</text>

  <rect x="60" y="212" width="700" height="250" rx="14" fill="#FFFFFF" stroke="#2B6777" stroke-width="3"/>
  <text x="90" y="254" font-family="Noto Sans CJK SC" font-size="19" fill="#2B6777">deepseek/deepseek-v4-flash</text>
  <text x="730" y="254" text-anchor="end" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2B6777">生效</text>
  <text x="90" y="298" font-family="Noto Sans CJK SC" font-size="19" fill="#2B6777">~deepseek/deepseek-flash-latest</text>
  <text x="730" y="298" text-anchor="end" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2B6777">生效</text>
  <text x="90" y="342" font-family="Noto Sans CJK SC" font-size="19" fill="#2B6777">~z-ai/glm-flash-latest（GLM Flash）</text>
  <text x="730" y="342" text-anchor="end" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2B6777">生效</text>
  <text x="90" y="386" font-family="Noto Sans CJK SC" font-size="19" fill="#2B6777">meta/muse-spark-1.3（含 -contributor）</text>
  <text x="730" y="386" text-anchor="end" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2B6777">生效</text>
  <text x="90" y="430" font-family="Noto Sans CJK SC" font-size="19" fill="#2B6777">openrouter/free（免费池的入口）</text>
  <text x="730" y="430" text-anchor="end" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#2B6777">生效</text>

  <text x="840" y="192" font-family="Noto Sans CJK SC" font-size="20" font-weight="700" fill="#B85C1E">被换掉的</text>

  <rect x="840" y="212" width="700" height="250" rx="14" fill="#FFF3E6" stroke="#E07B39" stroke-width="3"/>
  <text x="870" y="254" font-family="Noto Sans CJK SC" font-size="19" fill="#B85C1E">z-ai/glm-5.3-flash</text>
  <text x="1510" y="254" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">→ sonnet-5</text>
  <text x="870" y="298" font-family="Noto Sans CJK SC" font-size="19" fill="#B85C1E">z-ai/glm-5.2:free（所有 :free 后缀）</text>
  <text x="1510" y="298" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">→ sonnet-5</text>
  <text x="870" y="342" font-family="Noto Sans CJK SC" font-size="19" fill="#B85C1E">z-ai/glm-5.3-flashx</text>
  <text x="1510" y="342" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">→ sonnet-5</text>
  <text x="870" y="386" font-family="Noto Sans CJK SC" font-size="19" fill="#B85C1E">CLINE_PROVIDER=openrouter + :free</text>
  <text x="1510" y="386" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">→ sonnet-5</text>
  <text x="870" y="430" font-family="Noto Sans CJK SC" font-size="19" fill="#B85C1E">no-such-model-xyz（乱写的）</text>
  <text x="1510" y="430" text-anchor="end" font-family="Noto Sans CJK SC" font-size="18" font-weight="700" fill="#B85C1E">→ sonnet-5</text>

  <rect x="60" y="500" width="1480" height="96" rx="12" fill="#FFFFFF" stroke="#E07B39" stroke-width="3"/>
  <text x="800" y="542" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22" font-weight="700" fill="#B85C1E">回退目标是账号默认模型 anthropic/claude-sonnet-5，付费档</text>
  <text x="800" y="574" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">session/set_model 对任何字符串都回一个 {}，连"没生效"都不告诉你</text>

  <rect x="60" y="628" width="1480" height="120" rx="12" fill="#EFEBE2" stroke="#C9C2B4" stroke-width="2"/>
  <text x="90" y="668" font-family="Noto Sans CJK SC" font-size="19" font-weight="700" fill="#7A838B">所以这里的顺序是反的</text>
  <text x="90" y="704" font-family="Noto Sans CJK SC" font-size="18" fill="#7A838B">上一档（Qoder）学到的结论是"把模型放到启动参数上"，到了 Cline 这一档，启动参数也不保证作数</text>
  <text x="90" y="734" font-family="Noto Sans CJK SC" font-size="18" fill="#7A838B">模型这件事要"验证"，不是"设置"</text>

  <text x="60" y="804" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">实测：cline 3.0.63，session/new 回报的 models.currentModelId，逐个 id 对照 · 2026-09-22</text>
  <text x="60" y="836" font-family="Noto Sans CJK SC" font-size="17" fill="#98A4AD">「免费」这件事我只验证到"能选中"，账单要去 Cline 的计费页自己看</text>
</svg>
