<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif">
  <rect width="1600" height="900" fill="#F7F4EE"/>

  <text x="60" y="72" font-size="34" font-weight="700" fill="#1F2A33">一个画在另一个里面，就是这么来的</text>
  <text x="60" y="108" font-size="21" fill="#6B7A85">scale 记在图的 class 上，分发的时候只摘掉自己那一个</text>
  <line x1="60" y1="132" x2="1540" y2="132" stroke="#D8D2C6" stroke-width="2"/>

  <!-- ===== 第一行：class 链 ===== -->
  <text x="60" y="180" font-size="20" font-weight="700" fill="#1F2A33">p + scale_wrap(n = 2) + scale_y_break(c(7, 17))</text>

  <!-- step 1 -->
  <rect x="60" y="204" width="360" height="96" rx="12" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
  <text x="84" y="234" font-size="17" fill="#6B7A85">加完 scale_wrap 之后</text>
  <text x="84" y="266" font-size="20" font-weight="700" fill="#2B6777">ggwrap</text>
  <text x="180" y="266" font-size="18" fill="#6B7A85">| ggplot2::ggplot | …</text>

  <line x1="420" y1="252" x2="500" y2="252" stroke="#6B7A85" stroke-width="2"/>
  <polygon points="500,252 488,246 488,258" fill="#6B7A85"/>

  <!-- step 2 -->
  <rect x="500" y="204" width="400" height="96" rx="12" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
  <text x="524" y="234" font-size="17" fill="#6B7A85">再加 scale_y_break 之后</text>
  <text x="524" y="266" font-size="20" font-weight="700" fill="#2B6777">ggbreak</text>
  <text x="638" y="266" font-size="20" font-weight="700" fill="#E07B39">ggwrap</text>
  <text x="740" y="266" font-size="18" fill="#6B7A85">| ggplot | …</text>

  <!-- 摘掉第一个 -->
  <line x1="900" y1="252" x2="980" y2="252" stroke="#6B7A85" stroke-width="2"/>
  <polygon points="980,252 968,246 968,258" fill="#6B7A85"/>
  <text x="880" y="190" font-size="17" fill="#6B7A85">grid.draw() 按第一个 class 分发</text>

  <rect x="980" y="204" width="560" height="96" rx="12" fill="#FFF3E6" stroke="#E07B39" stroke-width="3"/>
  <text x="1004" y="234" font-size="17" fill="#E07B39">画完子图，只把 ggbreak 摘掉</text>
  <text x="1004" y="266" font-size="20" font-weight="700" fill="#1F2A33">子图身上还挂着 <tspan fill="#E07B39">ggwrap</tspan></text>

  <!-- ===== 第二行：is.ggbreak ===== -->
  <rect x="60" y="336" width="1480" height="132" rx="12" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
  <text x="88" y="372" font-size="21" font-weight="700" fill="#1F2A33">然后 aplot::plot_list() 里有一句 is.ggbreak()</text>

  <text x="88" y="410" font-size="19" fill="#1F2A33">ggfun::is.ggbreak() 对 <tspan font-weight="700" fill="#2B6777">ggbreak</tspan>、<tspan font-weight="700" fill="#2B6777">ggwrap</tspan>、<tspan font-weight="700" fill="#2B6777">ggcut</tspan> 都返回 TRUE</text>
  <text x="88" y="442" font-size="19" fill="#1F2A33">于是它不把子图当普通图处理，而是<tspan font-weight="700" fill="#E07B39">又把子图完整地画了一遍</tspan></text>

  <!-- ===== 第三行：结果示意 ===== -->
  <text x="60" y="516" font-size="20" font-weight="700" fill="#1F2A33">结果</text>

  <!-- wrap 的两个窗口 -->
  <rect x="60" y="536" width="700" height="230" rx="10" fill="#FFFFFF" stroke="#2B6777" stroke-width="3"/>
  <line x1="410" y1="536" x2="410" y2="766" stroke="#2B6777" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="80" y="566" font-size="17" fill="#6B7A85">wrap 窗口 1</text>
  <text x="430" y="566" font-size="17" fill="#6B7A85">wrap 窗口 2</text>

  <!-- 每个窗口里又嵌一套断轴 -->
  <g>
    <rect x="96" y="586" width="280" height="60" rx="6" fill="#FFF3E6" stroke="#E07B39" stroke-width="2"/>
    <rect x="96" y="666" width="280" height="60" rx="6" fill="#FFF3E6" stroke="#E07B39" stroke-width="2"/>
    <rect x="446" y="586" width="280" height="60" rx="6" fill="#FFF3E6" stroke="#E07B39" stroke-width="2"/>
    <rect x="446" y="666" width="280" height="60" rx="6" fill="#FFF3E6" stroke="#E07B39" stroke-width="2"/>
    <text x="120" y="624" font-size="16" fill="#E07B39">y 断轴 上窗口</text>
    <text x="120" y="704" font-size="16" fill="#E07B39">y 断轴 下窗口</text>
    <text x="470" y="624" font-size="16" fill="#E07B39">y 断轴 上窗口</text>
    <text x="470" y="704" font-size="16" fill="#E07B39">y 断轴 下窗口</text>
  </g>

  <!-- 右侧结论 -->
  <rect x="820" y="536" width="720" height="230" rx="12" fill="#FFFFFF" stroke="#D8D2C6" stroke-width="2"/>
  <text x="852" y="580" font-size="23" font-weight="700" fill="#1F2A33">这不是「不支持」</text>
  <text x="852" y="624" font-size="21" fill="#1F2A33">断轴的窗口整个嵌在 wrap 的窗口<tspan x="852" dy="34">里面。图是画得出来的，R 一句</tspan><tspan x="852" dy="34">话不说。</tspan></text>
  <text x="852" y="740" font-size="21" font-weight="700" fill="#E07B39">这是「画错了」。</text>
</svg>
